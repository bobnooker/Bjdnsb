name: RustDesk Remote Desktop

on:
  workflow_dispatch:

jobs:
  rustdesk-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
      - name: Download & Install RustDesk
        run: |
          Write-Host "Downloading RustDesk..."
          $url = "https://github.com/rustdesk/rustdesk/releases/download/1.3.1/rustdesk-1.3.1-x86_64.exe"
          Invoke-WebRequest -Uri $url -OutFile "$env:TEMP\rustdesk.exe"
          
          Write-Host "Installing RustDesk silently..."
          Start-Process -FilePath "$env:TEMP\rustdesk.exe" -ArgumentList "--silent-install" -Wait

      - name: Configure RustDesk Password & Start Service
        run: |
          $rustdesk = "$env:ProgramFiles\RustDesk\RustDesk.exe"
          
          # Set a custom password for the connection
          & $rustdesk --password MySecurePass123!
          
          # Ensure service is running
          Start-Service -Name "RustDesk" -ErrorAction SilentlyContinue

      - name: Output RustDesk Credentials
        run: |
          $rustdesk = "$env:ProgramFiles\RustDesk\RustDesk.exe"
          
          # Retrieve the automatically assigned RustDesk ID
          Start-Sleep -Seconds 5
          $id = &$rustdesk --get-id
          
          Write-Host "`n======================================"
          Write-Host "RUSTDESK CONNECTION INFO"
          Write-Host "ID: $id"
          Write-Host "Password: MySecurePass123!"
          Write-Host "======================================`n"

      - name: Keep Runner Alive
        run: |
          while ($true) {
              Write-Host "[$(Get-Date)] RustDesk Active..."
              Start-Sleep -Seconds 300
          }
