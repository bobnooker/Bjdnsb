name: RustDesk Remote Desktop

on:
  workflow_dispatch:

jobs:
  rustdesk-rdp:
    runs-on: windows-latest
    timeout-minutes: 3600

    steps:
      - name: Download & Run RustDesk
        run: |
          Write-Host "Downloading RustDesk..."
          $url = "https://github.com/rustdesk/rustdesk/releases/download/1.3.1/rustdesk-1.3.1-x86_64.exe"
          $exePath = "$env:TEMP\rustdesk.exe"
          Invoke-WebRequest -Uri $url -OutFile$exePath
          
          Write-Host "Starting RustDesk..."
          # Run RustDesk directly with a fixed password in the background
          Start-Process -FilePath $exePath -ArgumentList "--password MySecurePass123!" -WindowStyle Hidden
          
          # Give it a few seconds to initialize
          Start-Sleep -Seconds 8

      - name: Output RustDesk Credentials
        run: |
          $exePath = "$env:TEMP\rustdesk.exe"
          
          # Retrieve the automatically assigned RustDesk ID
          $id = &$exePath --get-id
          
          Write-Host "`n======================================"
          Write-Host "RUSTDESK CONNECTION INFO"
          Write-Host "ID: $id"
          Write-Host "Password: MySecurePass123!"
          Write-Host "======================================`n"

      - name: Keep Runner Alive
        run: |
          while ($true) {
              Write-Host "[$(Get-Date)] RustDesk Active..."
              Start-Sleep -Seconds 300
          }
